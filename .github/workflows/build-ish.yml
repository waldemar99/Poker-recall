name: Build for iSH
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build -- --base=./
      - uses: actions/upload-artifact@v4
        with:
          name: poker-recall-ish
          path: dist/
          retention-days: 30
